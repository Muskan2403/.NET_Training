<div class="container mt-4">
    <h2 class="mb-3 h3">My Orders</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Id</th>
                        <th>Item</th>
                        <th>Price (Rupees)</th>
                        <th>Date</th>
                        <th class="text-center">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let order of orders">
                        <td class="ps-3 text-muted">#{{ order.id }}</td>
                        <td class="fw-bold">{{ order.item }}</td>
                        <td>{{ order.price | currency:'INR':'symbol':'1.0-0' }}</td>
                        <td>{{ order.date | date:'shortDate' }}</td>
                        <td class="text-center">
                            <span class="badge rounded-pill px-3 py-2 text-uppercase fw-normal"
                                    [ngClass]="getStatusColorClass(order.status)">
                                    {{ order.status | orderStatus }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
